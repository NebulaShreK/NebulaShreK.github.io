<html>

    <div class="row">
      <div class="col" id="inputPictureDiv">
        <img id="inputImg">

        </button>
      </div>
      <div class="col" style="display: flex; justify-content: space-around;">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

<script>

let problem;
let problemStatus;
let correctAnswer;
let alreadyAnswers = [];


async function loadData(level) {
  try {
    // 상대 경로로 JSON 파일 요청
    const address = "./chinese/chinese_" + level + ".json"
    const response = await fetch(address);
    
    if (!response.ok) {
      throw new Error(`HTTP 오류! 상태코드: ${response.status}`);
    }
    
    // JSON 데이터 파싱
    problem = await response.json();
    // console.log(data); // 불러온 데이터 확인
    
  } catch (error) {
    console.error("데이터를 불러오는 중 오류 발생:", error);
  }
}

</script>

<script>

  function shuffle(array) {
    array.sort(() => Math.random() - 0.5);
  }

  function showProblem(problem) {
    var num = Object.keys(problem).length
    var problemStatus = Math.floor(Math.random() * 2)

    var problem;
    var answers;
    if (problemStatus < 1) {
      var question = Array.from(Object.keys(problem))
      var choices = Array.from(Object.values(problem))
    }
    else {
      var question = Array.from(Object.values(problem))
      var choices = Array.from(Object.keys(problem))
    }

    var possibleAnswers = [];
    for (var i=0; i<num; i++) {
      if (!alreadyAnswers.includes(i)) {
        possibleAnswers.push(i)
      }
    }
    
    var answers = []
    var selectNum = Math.floor(Math.random() * possibleAnswers.length)

    answerNum = possibleAnswers[selectNum]
    correctAnswer = choices[answerNum]
    answers.push(correctAnswer)
    alreadyAnswers.push(answerNum)
    if (alreadyAnswers.length == num) {
      alreadyAnswers = [];
    }

    while (answers.length < 4) {
      n = Math.floor(Math.random() * num)
      if (n === answerNum) {}
      else if (answers.includes(choices[n])) {}
      else {answers.push(choices[n])}
    }    
    

    var buttonNum = [...Array(4)].map(function(value, index) {return index})
    shuffle(buttonNum)

    document.querySelectorAll("span.answerSpan").forEach(function(span, index) {
      span.innerText = answers[buttonNum[index]]
    })

    document.querySelector("#inputQuestion").innerText = question[answerNum]
    
  }  
  
  document.querySelectorAll("button").forEach(function(item, index) {
    
     item.addEventListener("click", function(event) {
       answer = item.children[0].innerText
       if (answer === correctAnswer) {

        document.querySelector("#inputImg").src = "./correct.png"
        document.querySelector("#inputQuestion").innerText = ""

        const promise = new Promise((resolve, reject) =>
          setTimeout(() => {
            
            document.querySelector("#inputImg").src = ""
            
            showProblem(problem)
            resolve(1)
          }, 1000)
        )
       }
     })    
   })

  const urlParams = new URLSearchParams(window.location.search);
  const level = urlParams.get('level');

  loadData(level).then(result => {
      showProblem(problem);
    }
   );
  
</script>
